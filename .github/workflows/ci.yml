name: CI Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: lecture-updates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: main

      - name: Build Docker image
        working-directory: Lecture 3
        run: |
          docker build -t vowel-frequency-analyzer:latest .

      - name: Run Docker container
        run: |
          docker run --rm \
            -e GITHUB_USER="${{ github.actor }}" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w "/workspace/Lecture 3" \
            vowel-frequency-analyzer:latest

      - name: Publish the action image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag vowel-frequency-analyzer:latest ghcr.io/jfernuts/vowel-frequency-analyzer:latest
          docker push ghcr.io/jfernuts/vowel-frequency-analyzer:latest
          docker logout ghcr.io
